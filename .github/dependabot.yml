# Dependabot configuration for automated dependency updates.
# Keeps npm packages and GitHub Actions up-to-date with security patches.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2

updates:
  # npm dependencies (production + dev)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # Group minor/patch updates to reduce PR noise
    groups:
      production-deps:
        patterns:
          - "mssql"
          - "next"
          - "next-auth"
          - "react"
          - "react-dom"
          - "zod"
        update-types:
          - "minor"
          - "patch"
      dev-deps:
        patterns:
          - "@types/*"
          - "@typescript-eslint/*"
          - "@vitest/*"
          - "@playwright/*"
          - "eslint"
          - "typescript"
          - "vitest"
        update-types:
          - "minor"
          - "patch"
    # Only allow security updates for major versions (manual review required)
    versioning-strategy: increase
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps"
      include: "scope"

  # GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
